<!DOCTYPE html>
<html>
<head>
	<style>
		html, body {
			margin: 0;
			padding: 0;
		}
		.table-scaler {
			max-width: 100%;
			max-height: 100%;
			box-sizing: border-box;
		}

		table {
			width: 100%;
			height: 100vh;
			margin: 0;
			table-layout: fixed;
			border-collapse: collapse;
			box-sizing: border-box;
		}

		td {
			min-width: 0%;
			min-height: 0%;
			word-wrap: break-word;
		}
	</style>
</head>
<body>
	<div class="table-scaler">
		<table border="1" bordercolor="Black" cellspacing="0">
			<tr>
				<td bgcolor="White">Double agent</td>
				<td bgcolor="Red"><font color="White">Splinter cell</font></td>
			</tr>
		</table>
	</div>
</body>
</html>
